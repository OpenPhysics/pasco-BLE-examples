<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PASCO Wireless Motion Sensor</title>
    <link rel="stylesheet" href="common.css">
</head>
<body>
    <div class="container">
        <h1>Wireless Motion Sensor</h1>

        <div class="card">
            <div id="status" class="status disconnected">Disconnected</div>
            <div class="button-row">
                <button id="connectBtn" class="btn-primary">Connect to Motion Sensor</button>
                <button id="disconnectBtn" class="btn-danger" disabled>Disconnect</button>
            </div>
        </div>

        <div class="card">
            <div class="reading">
                <div class="value" id="positionValue">--</div>
                <div class="unit" id="positionUnit">m</div>
                <div class="label">Position</div>
            </div>
        </div>

        <div class="card" id="measurementsCard" style="display: none;">
            <h3>All Measurements</h3>
            <div id="measurementsList"></div>
        </div>

        <div class="card">
            <div class="info">
                <strong>Requirements:</strong><br>
                - Chrome or Edge browser (Web Bluetooth)<br>
                - PASCO Wireless Motion Sensor<br>
                - Sensor must be powered on
            </div>
        </div>

        <div id="errorDiv"></div>
    </div>

    <script type="importmap">
    {
        "imports": {
            "expr-eval": "https://esm.sh/expr-eval@2.0.2"
        }
    }
    </script>

    <script type="module">
        import { PASCOBLEDevice } from '../dist/index.js';
        import {
            setStatus as setStatusUtil,
            showError as showErrorUtil,
            formatNumber,
            setupDisconnectOnUnload
        } from './common.js';

        const connectBtn = document.getElementById('connectBtn');
        const disconnectBtn = document.getElementById('disconnectBtn');
        const statusDiv = document.getElementById('status');
        const positionValue = document.getElementById('positionValue');
        const positionUnit = document.getElementById('positionUnit');
        const measurementsCard = document.getElementById('measurementsCard');
        const measurementsList = document.getElementById('measurementsList');
        const errorDiv = document.getElementById('errorDiv');

        let device = null;
        let readingInterval = null;

        const setStatus = (status, text) => setStatusUtil(statusDiv, status, text);
        const showError = (message) => showErrorUtil(errorDiv, message);

        async function connect() {
            try {
                setStatus('connecting', 'Select your sensor...');
                connectBtn.disabled = true;
                errorDiv.innerHTML = '';

                device = new PASCOBLEDevice();
                const devices = await device.scan('Motion');

                if (devices.length === 0) {
                    throw new Error('No device selected');
                }

                setStatus('connecting', 'Connecting...');
                await device.connect(devices[0]);

                setStatus('connected', `Connected: ${devices[0].name}`);
                connectBtn.disabled = true;
                disconnectBtn.disabled = false;

                const measurements = device.getMeasurementList();
                console.log('Available measurements:', measurements);

                const unit = device.getMeasurementUnit('Position');
                if (unit) {
                    positionUnit.textContent = unit;
                }

                measurementsCard.style.display = 'block';
                startReading();

            } catch (error) {
                console.error('Connection error:', error);
                setStatus('disconnected', 'Disconnected');
                connectBtn.disabled = false;
                disconnectBtn.disabled = true;

                if (error.message.includes('User cancelled')) {
                    showError('Connection cancelled by user');
                } else if (error.message.includes('No device selected')) {
                    showError('No device selected');
                } else {
                    showError(`Connection failed: ${error.message}`);
                }
            }
        }

        async function disconnect() {
            try {
                stopReading();

                if (device) {
                    await device.disconnect();
                    device = null;
                }

                setStatus('disconnected', 'Disconnected');
                connectBtn.disabled = false;
                disconnectBtn.disabled = true;
                positionValue.textContent = '--';
                measurementsCard.style.display = 'none';
                measurementsList.innerHTML = '';

            } catch (error) {
                console.error('Disconnect error:', error);
                showError(`Disconnect error: ${error.message}`);
            }
        }

        function startReading() {
            readingInterval = setInterval(async () => {
                if (!device || !device.isConnected()) {
                    stopReading();
                    return;
                }

                try {
                    const measurements = device.getMeasurementList();
                    const data = await device.readDataList(measurements);

                    if (data['Position'] !== null && data['Position'] !== undefined) {
                        positionValue.textContent = data['Position'].toFixed(3);
                    }

                    let html = '';
                    for (const name of measurements) {
                        const value = data[name];
                        const unit = device.getMeasurementUnit(name) || '';
                        const displayValue = formatNumber(value);
                        html += `
                            <div class="measurement-row">
                                <span class="measurement-name">${name}</span>
                                <span class="measurement-value">${displayValue} ${unit}</span>
                            </div>
                        `;
                    }
                    measurementsList.innerHTML = html;

                } catch (error) {
                    console.error('Read error:', error);
                }
            }, 100);
        }

        function stopReading() {
            if (readingInterval) {
                clearInterval(readingInterval);
                readingInterval = null;
            }
        }

        connectBtn.addEventListener('click', connect);
        disconnectBtn.addEventListener('click', disconnect);
        setupDisconnectOnUnload(() => device);
    </script>
</body>
</html>
